<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 - 用户认证系统</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/forgot_password.css">
</head>
<body>
<!-- 找回密码页：用注册时填写的学号核验身份后重置密码 -->
<canvas id="particles-bg"></canvas>

<div class="fp-page">
    <div class="login-header">
        <div class="login-header-icon">AUTH</div>
        <div>
            <div class="login-header-title">用户认证系统</div>
            <div class="login-header-sub">统一身份认证 / Authentication System</div>
        </div>
        <span class="login-header-tag">RECOVER</span>
    </div>

    <div class="fp-card">
        <div class="fp-card-top"></div>
        <div class="fp-card-body">
            <div class="fp-card-title">找回密码</div>
            <div class="fp-card-sub">PASSWORD RECOVERY · 用注册时的学号核验身份</div>

            <div class="error-msg" role="alert" id="fpError" style="display:none;"></div>
            <div class="success-msg" role="status" id="fpOk" style="display:none;"></div>

            <form id="fpForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="fp_username">账号 USERNAME</label>
                    <input type="text" id="fp_username" name="username" placeholder="请输入登录账号" data-hint="请输入账号" required>
                </div>
                <div class="form-group">
                    <label for="fp_student_id">学号 STUDENT ID</label>
                    <input type="text" id="fp_student_id" name="student_id" placeholder="请输入注册时填写的学号" data-hint="请输入学号" required>
                </div>
                <div class="form-group">
                    <label for="fp_new_password">新密码 NEW PASSWORD</label>
                    <input type="password" id="fp_new_password" name="new_password" placeholder="至少 6 位" data-hint="请输入新密码" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="fp_confirm">确认密码 CONFIRM</label>
                    <input type="password" id="fp_confirm" name="confirm" placeholder="再次输入新密码" data-hint="请再次输入新密码" required>
                </div>
                <div class="form-group">
                    <label for="fp_captcha">验证码 CAPTCHA</label>
                    <div class="captcha-row">
                        <img id="captcha-img" alt="验证码" title="点击刷新">
                        <input type="text" id="fp_captcha" name="captcha" placeholder="不区分大小写" data-hint="请输入验证码" required>
                    </div>
                </div>
                <button type="submit" class="fp-submit">重 置 密 码</button>
            </form>

            <div class="fp-footer">
                想起来了？<a href="/login">返回登录</a>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/particles.js"></script>
<script src="/static/js/forgot_password.js"></script>
</body>
</html>
