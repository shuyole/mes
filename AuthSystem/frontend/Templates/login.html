<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<canvas id="particles-bg"></canvas>

<div class="login-page">
    <div class="login-header">
        <div class="login-header-icon">AUTH</div>
        <div>
            <div class="login-header-title">用户认证系统</div>
            <div class="login-header-sub">登录控制台</div>
        </div>
        <span class="login-header-tag">欢迎登录</span>
    </div>

    <div class="login-card">
        <div class="login-card-top"></div>
        <div class="login-card-body">
            <div class="login-card-title">账号登录</div>
            <div class="login-card-sub">请输入您的用户名和密码</div>

            <div class="error-msg" id="loginError" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label for="captcha">验证码</label>
                    <div class="captcha-row">
                        <img id="captcha-img" alt="验证码" title="点击刷新验证码">
                        <input type="text" id="captcha" name="captcha" placeholder="输入验证码" required>
                    </div>
                </div>

                <button type="submit" class="login-submit">登 录</button>
            </form>

            <div class="login-footer">
                还没有账号？<a href="/register">立即注册</a>
                &nbsp;·&nbsp;
                <a href="/forgot_password">找回密码</a>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/particles.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
