<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/forgot_password.css">
</head>
<body>

<canvas id="particles-bg"></canvas>

<div class="fp-page">
    <div class="login-header">
        <div class="login-header-icon">AUTH</div>
        <div>
            <div class="login-header-title">用户认证系统</div>
            <div class="login-header-sub">密码重置</div>
        </div>
        <span class="login-header-tag">找回密码</span>
    </div>

    <div class="fp-card">
        <div class="fp-card-top"></div>
        <div class="fp-card-body">
            <div class="fp-card-title">重置密码</div>
            <div class="fp-card-sub">请输入注册时填写的账号和学号进行身份核验</div>

            <div class="error-msg" id="fpError" style="display:none;"></div>
            <div class="success-msg" id="fpOk" style="display:none;"></div>

            <form id="fpForm">
                <div class="form-group">
                    <label for="fp_username">用户名</label>
                    <input type="text" id="fp_username" name="username" placeholder="请输入登录用户名" required>
                </div>
                <div class="form-group">
                    <label for="fp_student_id">学号</label>
                    <input type="text" id="fp_student_id" name="student_id" placeholder="请输入注册时的学号" required>
                </div>
                <div class="form-group">
                    <label for="fp_new_password">新密码</label>
                    <input type="password" id="fp_new_password" name="new_password" placeholder="请输入至少 6 位新密码" required>
                </div>
                <div class="form-group">
                    <label for="fp_confirm">确认新密码</label>
                    <input type="password" id="fp_confirm" name="confirm" placeholder="请再次输入新密码" required>
                </div>
                <div class="form-group">
                    <label for="fp_captcha">验证码</label>
                    <div class="captcha-row">
                        <img id="captcha-img" alt="验证码" title="点击刷新验证码">
                        <input type="text" id="fp_captcha" name="captcha" placeholder="输入验证码" required>
                    </div>
                </div>

                <button type="submit" class="fp-submit">重 置 密 码</button>
            </form>

            <div class="fp-footer">
                想起来了？<a href="/login">返回登录</a>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/particles.js"></script>
<script src="/static/js/forgot_password.js"></script>
</body>
</html>
