<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统主页</title>
    <link rel="stylesheet" href="/static/css/shell.css">
</head>
<body data-page="home">
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-mark">AUTH</div>
            <div>
                <h1>用户认证系统</h1>
                <p>统一管理后台</p>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-group-caption">系统菜单</div>
            <a href="/home" class="side-link active">
                <svg class="nav-svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>系统主页</span>
            </a>
            <a href="/settings" class="side-link">
                <svg class="nav-svg-icon" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                <span>系统设置</span>
            </a>
        </nav>

        <div class="sidebar-footer">用户认证服务</div>
    </aside>

    <div class="workspace">
        <div class="topbar">
            <div class="topbar-title">用户认证系统</div>
            <div class="topbar-controls">
                <div class="user-box">
                    <span class="clock" id="clock">--:--:--</span>
                    <span>用户 <b id="userName">加载中</b><span class="role-chip member" id="roleChip">--</span></span>
                    <a class="btn-logout" href="javascript:void(0)" id="logoutLink">退出登录</a>
                </div>
            </div>
        </div>

        <main class="page-content">
            <header class="page-heading">
                <div>
                    <h1>系统主页</h1>
                </div>
                <div class="page-context">欢迎登录用户认证系统</div>
            </header>

            <div class="grid-4">
                <div class="stat-card cyan">
                    <div class="stat-label">当前账号</div>
                    <div class="stat-value" id="statAccount">--</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-label">身份角色</div>
                    <div class="stat-value" id="statRole">--</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-label">账号状态</div>
                    <div class="stat-value" id="statStatus">--</div>
                </div>
                <div class="stat-card purple">
                    <div class="stat-label">登录状态</div>
                    <div class="stat-value" id="statLoginStatus">--</div>
                </div>
            </div>

            <div class="grid-2 settings-stack">
                <div class="panel">
                    <h2>个人信息</h2>
                    <table class="info-table">
                        <tr><th>登录用户名</th><td id="infoUsername">--</td></tr>
                        <tr><th>用户昵称</th><td id="infoDisplayName">--</td></tr>
                        <tr><th>角色权限</th><td id="infoRole">--</td></tr>
                    </table>
                </div>
                <div class="panel">
                    <h2>服务端口信息</h2>
                    <table class="info-table">
                        <tr><th>前端页面</th><td>http://127.0.0.1:6031</td></tr>
                        <tr><th>后端接口</th><td>http://127.0.0.1:8090</td></tr>
                        <tr><th>数据库服务</th><td>http://127.0.0.1:6070</td></tr>
                    </table>
                    <p class="hint" style="margin-top:10px;">所有服务已正常启动，页面与后端数据连通。</p>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/shell.js"></script>
</body>
</html>
