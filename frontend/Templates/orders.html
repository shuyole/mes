<!-- orders.html — 作业指示排产页面片段 -->
<div class="grid-2">
    <!-- 左栏面板：新建工单表单 -->
    <div class="panel">
        <div class="orders-panel-head">
            <h2>作业指示 / 下发生产指令</h2>
            <button type="button" class="top-tool-btn tool-cyan" onclick="fillSampleOrder()">📋 填入范例参数</button>
        </div>
        <p class="hint" id="orderHintAdmin" data-admin-only>管理员可将工单下发到产线。完工后点「返工」会退回 1 件再做；进度条可继续改返工数量。</p>
        <p class="hint" id="orderHintMember" data-member-only style="display:none;">普通成员可以提交工单、手动改进度、切换状态和删除；下发产线仍需管理员操作。</p>

        <form id="orderForm" onsubmit="return false;">
            <div class="form-group">
                <label>订单编号</label>
                <input type="text" name="order_no" id="inputOrderNo" placeholder="例如：WC20260917-001" data-hint="请输入订单编号" required>
            </div>
            <div class="form-group">
                <label>无线充电产品型号</label>
                <select name="product_code" id="selectProductCode">
                    <option value="WC-10W">WC-10W · 便携单线圈无线充 (10W)</option>
                    <option value="WC-15W" selected>WC-15W · 磁吸双线圈快充 (15W)</option>
                    <option value="WC-20W">WC-20W · 立式多线圈底座 (20W)</option>
                </select>
                <div id="productSpecBox" class="product-spec-box">
                    <div class="product-spec-title">产品技术规格：</div>
                    <span id="productSpecText">正在加载产品技术规格...</span>
                </div>
            </div>
            <div class="form-group">
                <label>计划生产数量 (件)</label>
                <input type="number" name="quantity" id="inputQuantity" min="1" value="10" placeholder="请输入生产数量" data-hint="请输入生产数量" required>
            </div>
            <div class="form-group">
                <label>排产优先级</label>
                <select name="priority" id="selectPriority">
                    <option value="1">1 - 普通批次</option>
                    <option value="2">2 - 加急交付</option>
                    <option value="3">3 - 紧急订单 (插单优先)</option>
                </select>
            </div>
            <div class="form-group">
                <label>交货日期</label>
                <input type="date" name="due_date" id="inputDueDate">
            </div>
            <div class="form-group">
                <label>批次备注 / 工艺要求</label>
                <input type="text" name="remark" id="inputRemark" placeholder="例如：Qi2认证产线样板批次">
            </div>
            <button class="btn btn-solid order-submit" type="submit" id="btnSubmitOrder">✓ 生成工单并加入排产队列</button>
        </form>
    </div>

    <!-- 右栏面板：排产队列 -->
    <div class="panel">
        <div class="orders-panel-head">
            <h2>排产队列</h2>
            <div class="orders-head-actions">
                <button type="button" class="top-tool-btn tool-cyan" onclick="seedDemoOrders()">⚡ 批量生成演示工单</button>
                <a href="javascript:void(0)" onclick="exportOrdersCSV()" class="top-tool-btn csv-link">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    导出工单报表 (CSV)
                </a>
            </div>
        </div>
        <!-- 工具条 -->
        <div class="toolbar orders-toolbar">
            <div class="filter-group" id="orderFilterGroup">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="待生产">待生产</button>
                <button class="filter-btn" data-filter="生产中">生产中</button>
                <button class="filter-btn" data-filter="暂停">暂停</button>
                <button class="filter-btn" data-filter="返工">返工</button>
                <button class="filter-btn" data-filter="已完成">已完成</button>
            </div>
            <input class="search-box" id="searchBox" placeholder="搜索订单号 / 产品">
        </div>
        <div class="table-responsive">
            <table class="order-queue-table">
                <thead>
                    <tr>
                        <th>优先级</th>
                        <th>订单编号</th>
                        <th>产品</th>
                        <th>数量</th>
                        <th>进度</th>
                        <th>状态</th>
                        <th>交货期</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="8" class="empty">正在加载工单队列...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="empty" id="ordersEmpty" style="display:none;">还没有工单。创建后可一键下发到无线充电组装产线。</div>
        <p class="hint orders-footnote">完工后出现「返工」：默认退回 1 件，状态改为返工，进度不再是 100%。返工做完可点「完成返工」或把进度重新拉满。</p>
    </div>
</div>

<script src="./static/js/orders.js"></script>
<script src="./static/js/progress.js"></script>
